- description: 'F1: Where is NVIDIA trading?'
  vars:
    qid: F1
    usecase: finance
    upstream_task: Where is NVIDIA trading?
    query: NVDA stock price today
    window_hours: 24
    domains: ''
    needs_back: Price, % change, timestamp
    freshness: real-time
    freshness_tier: real-time
    score_window_hours: 6
