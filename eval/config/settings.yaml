# Shared harness settings. Every provider and grader reads this file, so all
# six search providers use identical settings. Env vars of the same name (upper-case)
# override these values.

# answer_mode:
#   offline (default) = providers only SEARCH (latency, normalization, raw JSON,
#                       dates, anomalies, search cost) and return the top results
#                       as compact JSON. No Anthropic/OpenAI call anywhere.
#                       Answers + grades are produced afterwards by Claude Code
#                       from `./run.sh export <uc>` (see grading/RUBRIC.md).
#   api               = legacy path: Claude answers via the API and LLM graders run
#                       inside promptfoo (needs ANTHROPIC_API_KEY).
answer_mode: offline

# Answer model (api mode only): the SAME Claude model answers for every search provider and
# runs the Claude-native arm. IDs from the claude-api skill (cached 2026-09-25)
# and https://platform.claude.com/docs/en/about-claude/models (checked 2026-10-08).
answer_model: claude-opus-5-5
# Grader model for the SimpleQA grader, relevance labels and promptfoo
# model-graded assertions. Kept identical to the answer model by default.
grader_model: claude-opus-5-5
# Claude Opus 5.5 cannot disable thinking; effort is the only control and its
# default is "medium", so we set it explicitly for stability across runs.
answer_effort: medium
grader_effort: medium
answer_max_tokens: 16000
grader_max_tokens: 8000

# Retrieval settings (identical for all providers)
num_results: 10            # results requested from each search API
answer_top_k: 5            # results passed to the answer model
answer_chars_per_result: 2000   # truncation per result (content, else snippet)
date_filter_hours_default: 48   # provider-side date filter where supported
request_timeout_s: 30

# Latency measurement
# search  = one discarded warm-up search per worker process (costs one search)
# connect = warm the TLS connection only (HEAD/GET on the API host), no credits
# off     = no warm-up
warmup_mode: search
warmup_query: "weather forecast"

# Latency budgets (ms) for the non-blocking latency check (metric 1)
latency_budget_ms:
  insurance: 500
  finance: 3000
  gtm: 3000
  simpleqa: 3000

# Claude-native arm (web_search server tool)
# web_search_20260318 is the newest version in
# https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool (checked 2026-10-08);
# it runs with dynamic filtering (allowed_callers defaults to code execution).
claude_web_search_tool: web_search_20260318
claude_web_search_max_uses: 5
claude_max_pause_turn_continuations: 3

# Citation check
citation_fetch_timeout_s: 15
citation_support_threshold: 70   # rapidfuzz partial_ratio (0-100)

# Where outputs go (relative to eval/)
out_dir: out
