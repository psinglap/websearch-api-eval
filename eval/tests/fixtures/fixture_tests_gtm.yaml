- description: 'G1: Find developers hitting Kafka latency problems right now'
  vars:
    qid: G1
    usecase: gtm
    upstream_task: Find developers hitting Kafka latency problems right now
    query: kafka consumer lag high latency issue
    window_hours: 6
    domains: github.com
    needs_back: Issue URLs opened in the last 6 hours, repo/org, time, the error described
    freshness: real-time
    freshness_tier: real-time
    score_window_hours: 6
    expected_answer: '[FILL AT RUN TIME]'
    expect_none: '[FILL AT RUN TIME]'
    source_urls: https://github.com/search?q=kafka+consumer+lag+latency&type=issues&s=created&o=desc
    answer_type: list
    tolerance: ''
    ground_truth_file: ground_truth/G1.json
  assert: []
