# Generated by config/make_configs.py - edit that file, then: .venv/bin/python config/make_configs.py
# Run via ./run.sh (adds --repeat 3 --no-cache and exports JSON/CSV).
description: SimpleQA control sample (20 q, seed 42) - OPTIONAL harness cross-check (api mode)
prompts:
- file://prompts/query.txt
providers:
- id: file://providers/youcom.py
  label: You.com
  config:
    pythonExecutable: .venv/bin/python
    workers: 1
    timeout: 300000
- id: file://providers/tavily.py
  label: Tavily
  config:
    pythonExecutable: .venv/bin/python
    workers: 1
    timeout: 300000
- id: file://providers/exa.py
  label: Exa
  config:
    pythonExecutable: .venv/bin/python
    workers: 1
    timeout: 300000
- id: file://providers/parallel.py
  label: Parallel
  config:
    pythonExecutable: .venv/bin/python
    workers: 1
    timeout: 300000
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-opus-5-5
      config:
        max_tokens: 8000
        effort: medium
  assert:
  - type: python
    value: file://asserts/accuracy_simpleqa.py
    metric: accuracy
  - type: python
    value: file://asserts/precision_at5.py
    metric: precision_at_5
  - type: python
    value: file://asserts/freshness.py
    metric: freshness
  - type: python
    value: file://asserts/recall.py
    metric: recall
  - type: python
    value: file://asserts/citation_validity.py
    metric: citation_validity
  - type: context-faithfulness
    contextTransform: '(function(){const m=context.metadata||{};const rs=(m.results||[]).slice(0,5).map((r,i)=>''[''+(i+1)+''] ''+r.url+''\n''+String(r.content||r.snippet||'''').slice(0,2000));const cs=(m.citations||[]).map(c=>c.url+'':
      ''+(c.cited_text||''''));const t=rs.concat(cs).join(''\n\n'');return t.trim()?t:''(no retrieved context)'';})()'
    threshold: 0.5
    metric: groundedness
  - type: python
    value: file://asserts/content_one_call.py
    metric: content_in_one_call
  - type: python
    value: file://asserts/latency_budget.py
    metric: latency_budget
  - type: latency
    threshold: 3000
    weight: 0
  - type: python
    value: file://asserts/token_cost.py
    metric: token_cost
  - type: python
    value: file://asserts/reliability.py
    metric: reliability
tests: file://crosscheck/simpleqa_sample.yaml
evaluateOptions:
  maxConcurrency: 4
outputPath:
- out/simpleqa_results.json
