# Generated by config/make_configs.py - edit that file, then: .venv/bin/python config/make_configs.py
# Run via ./run.sh (adds --repeat 3 --no-cache and exports JSON/CSV).
description: F1 only - You.com with knowledge=core (variant, not a separate competitor)
prompts:
- file://prompts/query.txt
providers:
- id: file://providers/youcom.py
  label: 'You.com [variant: knowledge=core]'
  config:
    pythonExecutable: .venv/bin/python
    workers: 1
    timeout: 300000
    knowledge: core
    variant: knowledge=core
    provider_name: youcom_knowledge
defaultTest:
  assert:
  - type: python
    value: file://asserts/freshness.py
    metric: freshness
  - type: python
    value: file://asserts/recall.py
    metric: recall
  - type: python
    value: file://asserts/citation_validity.py
    metric: url_validity
  - type: python
    value: file://asserts/content_one_call.py
    metric: content_in_one_call
  - type: python
    value: file://asserts/latency_budget.py
    metric: latency_budget
  - type: latency
    threshold: 3000
    weight: 0
  - type: python
    value: file://asserts/token_cost.py
    metric: token_cost
  - type: python
    value: file://asserts/reliability.py
    metric: reliability
tests: file://tests/finance_f1_variant.yaml
evaluateOptions:
  maxConcurrency: 4
outputPath:
- out/finance_results.json
