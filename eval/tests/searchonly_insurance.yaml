- description: 'I1: Caller wants a new Florida homeowners policy'
  vars:
    qid: I1
    usecase: searchonly_insurance
    upstream_task: Caller wants a new Florida homeowners policy
    query: Citizens Property Insurance binding suspension Florida
    window_hours: 24
    domains: citizensfla.com
    needs_back: Suspended yes/no, scope, effective date/time
    freshness: real-time
    freshness_tier: real-time
    score_window_hours: 6
    expected_answer: '[FILL AT RUN TIME]'
    expect_none: false
    source_urls: https://www.citizensfla.com/
    answer_type: exact
    tolerance: ''
    ground_truth_file: ground_truth/I1.json
  assert: []
